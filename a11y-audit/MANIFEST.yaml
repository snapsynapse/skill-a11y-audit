        section guards cross-version comparisons, and stale no-CI claims
        corrected. Validated via npm run validate (15/15, including new
        eval-11 mismatch assertions and validateAxeVersion hardening
        regressions). Durable follow-up now lives in ROADMAP.md.
    - platform: OpenAI Codex
      model: GPT-5
      surface: Desktop
      status: pass
      date: 2026-07-11
      skill_version: 22
      notes: >
        External landscape review repositioned the project as a narrow,
        self-hosted regression gate for large web estates. The v2.3.1 patch
        corrects public installation, migrates assistant-guide v0.3.3 to
        GuideCheck 0.7.0, and adds eval-14 distribution drift coverage.
        Validated via npm run validate (18/18 deterministic checks) plus the
        GuideCheck Level 3 reference verifier.
    - platform: Anthropic Claude
      model: Claude Fable 5
      surface: Code
      status: pass
      date: 2026-07-13
      skill_version: 17
      notes: >
        Pluggable standards data (v2.4.0): criteria matrices extracted
        to references/standards (wcag21-aa default, wcag22-aa with the
        six new criteria and 4.1.1 removed, en301549 clause-9
        rendering), selected via report.js --standard with strict id
        validation. Assistant guide v0.3.4 re-pins report.js. Validated
        via npm run validate (19/19) and the GuideCheck 0.7.0 reference
        verifier (Level 3, no findings).
  spec_version: agentskills.io/1.0
  frontmatter_mode: minimal

dependencies:
  - name: npm:axe-core
    note: >
      Injected into Puppeteer/Playwright pages for WCAG violation
      detection via axe.run(). Install via: npm install axe-core
  - name: npm:puppeteer
    note: >
      Browser automation for loading pages and injecting axe-core in the
      bundled scanner. Auto-install uses a pinned release.
  - name: lighthouse
    note: >
      CLI for accessibility scoring per page. Optional but recommended.
      Run via: npx lighthouse. Install globally: npm install -g lighthouse
  - name: issue tracker CLI (conditional)
    note: >
      Only needed in markdown+issues output mode. GitHub: gh.
      GitLab: glab. Linear: linear CLI or API. Jira: go-jira CLI.

