    - platform: OpenAI Codex
      model: GPT-5
      surface: Code
      status: pass
      date: 2026-05-31
      skill_version: 17
      notes: >
        Security hardening pass validated by `npm run validate`.
        Scanner dependency installation now rejects unsupported browser
        package names before dependency lookup and invokes npm with argv.
        Discovery is same-origin by default with explicit cross-origin
        sitemap opt-in, bounded fetches, and blocked-origin disclosure.
        Report and issue-plan Markdown now escape target-derived fields.
    - platform: Anthropic Claude
