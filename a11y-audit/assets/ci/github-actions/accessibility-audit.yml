name: Accessibility Regression Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: npm ci && npm run build

      - name: Scan representative templates
        uses: snapsynapse/skill-a11y-audit/.github/actions/scan@v2.5.0
        with:
          serve-path: dist
          port: '8088'
          discover-url: http://127.0.0.1:8088/
          baseline: .a11y-audit/baseline.json
          fail-on: new
          output: artifacts/a11y-scan.json
          discover-output: artifacts/a11y-discover.json

# Adapt the build command and serve-path to the target repository. Create or
# update .a11y-audit/baseline.json only after explicit human review.
