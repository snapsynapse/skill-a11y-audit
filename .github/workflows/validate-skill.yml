name: Validate Skill Bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install validation dependencies
        run: npm ci

      - name: Validate skill bundle
        run: npm run validate

      - name: Stage Pages artifact
        run: npm run build:site

      - name: Validate search contract
        run: npm run check:search

      - name: Audit root validation dependencies
        if: matrix.node == '22.12.0'
        run: npm run audit:deps

  guidecheck:
    name: Verify assistant guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned GuideCheck verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: snapsynapse/guidecheck
          ref: 3a5cbb5e880db00e0a8f44b68d89df0a73e53a45
          path: .guidecheck
          persist-credentials: false

      - name: Verify assistant guide against GuideCheck 0.7.0
        run: python3 .guidecheck/scripts/guidecheck_verify.py assistant-guide.txt --pretty

  browser-eval:
    name: Real browser eval (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned scanner dependencies
        run: npm ci --prefix a11y-audit/deps

      - name: Test isolated external consumer
        run: npm run eval:consumer

      - name: Audit scanner dependencies against the reviewed allowlist
        run: npm run audit:scanner

      - name: Run real browser and baseline eval
        run: npm run eval:browser

  action-consumer:
    name: Consumer Action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the local Action as a consumer
        uses: ./.github/actions/scan
        with:
          serve-path: a11y-audit/evals/fixtures/eval-3
          port: '8088'
          discover-url: http://127.0.0.1:8088/
          discover-no-sitemap: true
          discover-group-map: a11y-audit/evals/fixtures/eval-19/route-group-map.json
          surface-map: a11y-audit/evals/fixtures/eval-19/surface-map.json
          changed-files: a11y-audit/evals/fixtures/eval-19/changed-files.json
          fail-on: none
          output: artifacts/action-scan.json
          discover-output: artifacts/action-discover.json
          selection-output: artifacts/action-selection.json
          artifact-name: consumer-action-evidence

      - name: Verify consumer outputs
        run: |
          test -s artifacts/action-scan.json
          test -s artifacts/action-discover.json
          test -s artifacts/action-selection.json
          node -e "const s=require('./artifacts/action-scan.json'); if(!s.results?.length || s.errors?.length) process.exit(1)"
          node -e "const d=require('./artifacts/action-discover.json'); if(d.routeGrouping?.mode!=='mapped' || d.groups?.[0]?.pattern!=='fixture') process.exit(1)"
          node -e "const s=require('./artifacts/action-selection.json'); if(s.changedSurface?.mode!=='targeted' || s.changedSurface?.reason!=='mapped-changes' || s.changedSurface?.directUrls?.[0]!=='http://127.0.0.1:8088/') process.exit(1)"

      - name: Run pull-request base and head selection as a consumer
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/scan
        with:
          serve-path: a11y-audit/evals/fixtures/eval-3
          port: '8089'
          discover-url: http://127.0.0.1:8089/
          discover-no-sitemap: true
          discover-group-map: a11y-audit/evals/fixtures/eval-19/route-group-map.json
          surface-map: a11y-audit/evals/fixtures/eval-19/surface-map.json
          changed-base: ${{ github.event.pull_request.base.sha }}
          changed-head: ${{ github.event.pull_request.head.sha }}
          fail-on: none
          output: artifacts/pr-action-scan.json
          discover-output: artifacts/pr-action-discover.json
          selection-output: artifacts/pr-action-selection.json
          upload-artifact: false

      - name: Verify pull-request base and head evidence
        if: github.event_name == 'pull_request'
        run: |
          test -s artifacts/pr-action-scan.json
          test -s artifacts/pr-action-discover.json
          test -s artifacts/pr-action-selection.json
          node -e "const s=require('./artifacts/pr-action-selection.json'); if(!['targeted','full-fallback'].includes(s.changedSurface?.mode) || !s.changedSurface?.changedFiles?.length || !s.scanList?.length) process.exit(1)"

  workflow-audit:
    name: Workflow semantics and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint 1.7.12
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Set up uv 0.11.31
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.31

      - name: Run zizmor 1.28.0
        run: uvx zizmor==1.28.0 --offline --min-severity low .
