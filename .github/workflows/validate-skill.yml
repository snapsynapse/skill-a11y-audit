name: Validate Skill Bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install validation dependencies
        run: npm ci

      - name: Validate skill bundle
        run: npm run validate

  guidecheck:
    name: Verify assistant guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned GuideCheck verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: snapsynapse/guidecheck
          ref: 3a5cbb5e880db00e0a8f44b68d89df0a73e53a45
          path: .guidecheck
          persist-credentials: false

      - name: Verify assistant guide against GuideCheck 0.7.0
        run: python3 .guidecheck/scripts/guidecheck_verify.py assistant-guide.txt --pretty

  browser-eval:
    name: Real browser eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install pinned scanner dependencies
        run: npm ci --prefix a11y-audit/deps

      - name: Run real browser and baseline eval
        run: npm run eval:browser

  action-consumer:
    name: Consumer Action smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the local Action as a consumer
        uses: ./.github/actions/scan
        with:
          serve-path: a11y-audit/evals/fixtures/eval-3
          port: '8088'
          discover-url: http://127.0.0.1:8088/
          discover-no-sitemap: true
          fail-on: none
          output: artifacts/action-scan.json
          discover-output: artifacts/action-discover.json
          artifact-name: consumer-action-evidence

      - name: Verify consumer outputs
        run: |
          test -s artifacts/action-scan.json
          test -s artifacts/action-discover.json
          node -e "const s=require('./artifacts/action-scan.json'); if(!s.results?.length || s.errors?.length) process.exit(1)"

  workflow-audit:
    name: Workflow semantics and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint 1.7.12
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Set up uv 0.11.31
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.31

      - name: Run zizmor 1.28.0
        run: uvx zizmor==1.28.0 --offline --min-severity low .
