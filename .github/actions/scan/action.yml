name: 'a11y scan'
description: >
  Discover representative templates, optionally prioritize groups affected
  by repository changes, run axe-core via Puppeteer, fail on all or only newly
  introduced violations, and retain scan and selection evidence as artifacts.

outputs:
  results-path:
    description: Path to the scan results JSON.
    value: ${{ inputs.output }}
  discovery-path:
    description: Path to the discovery plan JSON when discover-url is set.
    value: ${{ inputs.discover-output }}
  selection-path:
    description: Path to the changed-surface selection plan when enabled.
    value: ${{ inputs.selection-output }}

inputs:
  serve-path:
    description: >
      Directory to serve over http-server while scanning. Leave empty if
      the scan target is already reachable (e.g. a preview deploy URL).
    required: false
    default: ''
  port:
    description: Port for the local http-server. Ignored when serve-path is empty.
    required: false
    default: '8088'
  sitemap:
    description: >
      Sitemap URL to discover targets from (e.g.
      http://localhost:8088/sitemap.xml). Combined with `urls` if both set.
    required: false
    default: ''
  sitemap-find:
    description: Substring in sitemap <loc> entries to replace before scanning.
    required: false
    default: ''
  sitemap-replace:
    description: Replacement for sitemap-find (typically the local http-server origin).
    required: false
    default: ''
  sitemap-exclude:
    description: Regex of sitemap URLs to drop (e.g. non-HTML assets).
    required: false
    default: ''
  urls:
    description: Comma-separated explicit URLs to scan, on top of any sitemap discovery.
    required: false
    default: ''
  discover-url:
    description: Base URL for deterministic template-aware representative selection.
    required: false
    default: ''
  discover-output:
    description: Path to retain the template-aware discovery plan JSON.
    required: false
    default: 'a11y-discover-plan.json'
  discover-max-per-group:
    description: Maximum representative pages selected per template group.
    required: false
    default: '2'
  discover-group-map:
    description: Repository-relative path to a reviewed route-group map.
    required: false
    default: ''
  discover-no-sitemap:
    description: '`true` to crawl from discover-url instead of reading a sitemap.'
    required: false
    default: 'false'
  allow-cross-origin-sitemaps:
    description: '`true` to allow discover.js to follow sitemap documents on other origins.'
    required: false
    default: 'false'
  surface-map:
    description: Repository-relative path to the source-prefix ownership map.
    required: false
    default: ''
  changed-files:
    description: Optional path to a JSON array of changed repository paths.
    required: false
    default: ''
  changed-base:
    description: Full Git object ID for the base of changed-surface comparison.
    required: false
    default: ''
  changed-head:
    description: Full Git object ID or HEAD for the comparison head.
    required: false
    default: 'HEAD'
  selection-output:
    description: Path to retain the scan-compatible changed-surface plan JSON.
    required: false
    default: 'a11y-selection-plan.json'
  fail-on:
    description: '`errors` for any violation, `new` for findings outside the accepted baseline, or `none`.'
    required: false
    default: 'errors'
  baseline:
    description: Path to an accepted accessibility baseline JSON file. Required when fail-on is `new`.
    required: false
    default: ''
  output:
    description: Path to write the scan results JSON.
    required: false
    default: 'a11y-scan-results.json'
  summary:
    description: '`true` to write the compact summary shape, `false` for full axe output.'
    required: false
    default: 'true'
  node-version:
    description: Node.js version for the scan environment.
    required: false
    default: '20'
  install-timeout-ms:
    description: Maximum milliseconds for each scanner dependency install attempt.
    required: false
    default: '120000'
  upload-artifact:
    description: '`true` to upload the results JSON as a workflow artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: 'a11y-scan-results'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Prepare local http-server
      if: inputs.serve-path != ''
      shell: bash
      env:
        SERVER_ROOT: ${{ runner.temp }}/a11y-audit-http-server
      run: |
        mkdir -p "$SERVER_ROOT"
        npm install --prefix "$SERVER_ROOT" --no-save --package-lock=false --no-audit --no-fund http-server@14.1.1

    - name: Start local http-server
      if: inputs.serve-path != ''
      shell: bash
      env:
        SERVE_PATH: ${{ inputs.serve-path }}
        PORT: ${{ inputs.port }}
        SERVER_ROOT: ${{ runner.temp }}/a11y-audit-http-server
      run: |
        "$SERVER_ROOT/node_modules/.bin/http-server" "$SERVE_PATH" -p "$PORT" -c-1 > /tmp/a11y-http.log 2>&1 &
        echo $! > /tmp/a11y-http.pid
        for i in $(seq 1 30); do
          curl -fs "http://localhost:$PORT/" > /dev/null && break || sleep 0.5
        done
        curl -fs "http://localhost:$PORT/" > /dev/null || (cat /tmp/a11y-http.log; exit 1)

    - name: Discover representative templates
      if: inputs.discover-url != ''
      shell: bash
      env:
        DISCOVER_URL: ${{ inputs.discover-url }}
        DISCOVER_OUTPUT: ${{ inputs.discover-output }}
        DISCOVER_MAX_PER_GROUP: ${{ inputs.discover-max-per-group }}
        DISCOVER_GROUP_MAP: ${{ inputs.discover-group-map }}
        DISCOVER_NO_SITEMAP: ${{ inputs.discover-no-sitemap }}
        ALLOW_CROSS_ORIGIN_SITEMAPS: ${{ inputs.allow-cross-origin-sitemaps }}
      run: |
        ARGS=(--url "$DISCOVER_URL" --output "$DISCOVER_OUTPUT")
        [ -n "$DISCOVER_MAX_PER_GROUP" ] && ARGS+=(--max-per-group "$DISCOVER_MAX_PER_GROUP")
        [ -n "$DISCOVER_GROUP_MAP" ] && ARGS+=(--group-map "$DISCOVER_GROUP_MAP")
        [ "$DISCOVER_NO_SITEMAP" = "true" ] && ARGS+=(--no-sitemap)
        [ "$ALLOW_CROSS_ORIGIN_SITEMAPS" = "true" ] && ARGS+=(--allow-cross-origin-sitemaps)
        node "${{ github.action_path }}/../../../a11y-audit/scripts/discover.js" "${ARGS[@]}"

    - name: Select changed surfaces
      if: inputs.discover-url != '' && inputs.surface-map != '' && (inputs.changed-files != '' || inputs.changed-base != '')
      shell: bash
      env:
        DISCOVER_OUTPUT: ${{ inputs.discover-output }}
        SURFACE_MAP: ${{ inputs.surface-map }}
        DISCOVER_GROUP_MAP: ${{ inputs.discover-group-map }}
        CHANGED_FILES: ${{ inputs.changed-files }}
        CHANGED_BASE: ${{ inputs.changed-base }}
        CHANGED_HEAD: ${{ inputs.changed-head }}
        SELECTION_OUTPUT: ${{ inputs.selection-output }}
      run: |
        ARGS=(--discover "$DISCOVER_OUTPUT" --map "$SURFACE_MAP" --output "$SELECTION_OUTPUT")
        [ -n "$DISCOVER_GROUP_MAP" ] && ARGS+=(--group-map "$DISCOVER_GROUP_MAP")
        if [ -n "$CHANGED_FILES" ]; then
          ARGS+=(--changed-files "$CHANGED_FILES")
        else
          ARGS+=(--base "$CHANGED_BASE" --head "$CHANGED_HEAD")
        fi
        node "${{ github.action_path }}/../../../a11y-audit/scripts/select-changed-surfaces.js" "${ARGS[@]}"

    - name: Run a11y scan
      shell: bash
      env:
        SITEMAP: ${{ inputs.sitemap }}
        SITEMAP_FIND: ${{ inputs.sitemap-find }}
        SITEMAP_REPLACE: ${{ inputs.sitemap-replace }}
        SITEMAP_EXCLUDE: ${{ inputs.sitemap-exclude }}
        URLS: ${{ inputs.urls }}
        DISCOVER_URL: ${{ inputs.discover-url }}
        DISCOVER_OUTPUT: ${{ inputs.discover-output }}
        SURFACE_MAP: ${{ inputs.surface-map }}
        CHANGED_FILES: ${{ inputs.changed-files }}
        CHANGED_BASE: ${{ inputs.changed-base }}
        SELECTION_OUTPUT: ${{ inputs.selection-output }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        OUTPUT: ${{ inputs.output }}
        SUMMARY: ${{ inputs.summary }}
        INSTALL_TIMEOUT_MS: ${{ inputs.install-timeout-ms }}
      run: |
        ARGS=()
        DISCOVER_PLAN="$DISCOVER_OUTPUT"
        if [ -n "$SURFACE_MAP" ] && [ -s "$SELECTION_OUTPUT" ] && { [ -n "$CHANGED_FILES" ] || [ -n "$CHANGED_BASE" ]; }; then
          DISCOVER_PLAN="$SELECTION_OUTPUT"
        fi
        [ -n "$SITEMAP" ]         && ARGS+=(--sitemap "$SITEMAP")
        [ -n "$SITEMAP_FIND" ]    && ARGS+=(--sitemap-find "$SITEMAP_FIND")
        [ -n "$SITEMAP_REPLACE" ] && ARGS+=(--sitemap-replace "$SITEMAP_REPLACE")
        [ -n "$SITEMAP_EXCLUDE" ] && ARGS+=(--sitemap-exclude "$SITEMAP_EXCLUDE")
        [ -n "$URLS" ]            && ARGS+=(--urls "$URLS")
        [ -n "$DISCOVER_URL" ]    && ARGS+=(--discover "$DISCOVER_PLAN")
        [ -n "$FAIL_ON" ]         && ARGS+=(--fail-on "$FAIL_ON")
        [ -n "$BASELINE" ]        && ARGS+=(--baseline "$BASELINE")
        [ "$SUMMARY" = "true" ]   && ARGS+=(--summary)
        [ -n "$INSTALL_TIMEOUT_MS" ] && ARGS+=(--install-timeout-ms "$INSTALL_TIMEOUT_MS")
        ARGS+=(--output "$OUTPUT")
        node "${{ github.action_path }}/../../../a11y-audit/scripts/scan.js" "${ARGS[@]}"

    - name: Stop local http-server
      if: always() && inputs.serve-path != ''
      shell: bash
      run: |
        if [ -f /tmp/a11y-http.pid ]; then kill "$(cat /tmp/a11y-http.pid)" 2>/dev/null || true; fi

    - name: Upload results artifact
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output }}
          ${{ inputs.discover-output }}
          ${{ inputs.selection-output }}
        if-no-files-found: ignore
