version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /a11y-audit/deps
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: puppeteer
        update-types:
          - version-update:semver-major
